services:
  postgres:
    image: postgres:15-alpine
    container_name: med4u-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-med4u_user}
      POSTGRES_DB: ${DB_NAME:-med4u_db}
    ports:
      # Bound to localhost only: the database must never be reachable from the network.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-med4u_user} -d ${DB_NAME:-med4u_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: med4u-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.local.conf"]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
      - ./redis.local.conf:/usr/local/etc/redis/redis.local.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$(awk '/^requirepass / {print $$2}' /usr/local/etc/redis/redis.local.conf); redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: med4u-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
