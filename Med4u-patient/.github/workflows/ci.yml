name: App CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Any https URL: the bundle only needs the variable to exist. Production builds reject http://.
      EXPO_PUBLIC_API_URL: https://api.example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci

      - name: Bundle check (Android, Hermes)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/android-export"

      - name: Bundle check (web)
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web-export"

      # Critical only: the remaining high findings are Expo/Metro build tooling that needs an Expo SDK upgrade.
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical
